[package]
name = "sqlx-cloudsql"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres", "mysql"]
postgres = ["sqlx/postgres"]
# MySQL needs `mysql-rsa`: sqlx does not know that the stream is TLS, so it encrypts the
# password with the RSA key of the server, same as the Go MySQL driver.
mysql = ["sqlx/mysql", "sqlx/mysql-rsa"]

[dependencies]
google-cloud-auth = { version = "1", default-features = false }
google-cloud-gax = "1"
google-cloud-sql-v1 = { version = "2", default-features = false }
rand = { version = "0.10.1", features = ["thread_rng"], default-features = false }
rsa = "0.10.0"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
socket2 = { version = "0.6", features = ["all"] }
spki = { version = "0.8", features = ["pem"] }
sqlx = { version = "0.9.0", git = "https://github.com/valkum/sqlx", branch = "dev/cloudsql", default-features = false, features = ["runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1"
x509-parser = "0.18.1"

[dev-dependencies]
bytes = "1"
clap = { version = "4.6.8", features = ["derive", "env"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[example]]
name = "connect"
required-features = ["postgres", "mysql"]
